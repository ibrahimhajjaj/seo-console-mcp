name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.18.1", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # A committed package-lock.json generated on one OS makes npm skip the
      # platform-specific optional native binding vitest 4's rolldown needs on
      # another OS (npm/cli#4828). Removing the lockfile first lets npm resolve
      # the correct binding fresh for this runner, which is npm's own recommended
      # fix for the error. The committed lockfile is kept for local reproducibility.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
